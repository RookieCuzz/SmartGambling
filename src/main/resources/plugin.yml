name: SmartGambling
version: '${project.version}'
main: me.arthed.smartgambling.SmartGambling
api-version: '1.20'
depend: [Vault, CraftEngine]
softdepend: [WorldGuard, PlaceholderAPI]
author: 'Styro457'
authors:
  - 'Styro457'
  - 'MihiBlu'
commands:
  sg:
    description: SmartGambling 管理命令
    aliases: ["smartgambling"]
    permission: sg.admin
  jackpot:
    description: 打开累积奖池菜单
    aliases: ["jp", "lottery"]
permissions:
  sg.admin:
    description: 允许管理 SmartGambling 并核对资金账本
    default: op
